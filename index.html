<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Renato Chumbiauca Rebagliati | Marketing en SintonIA
  </title>

  <style>

    /* =========================
       CONFIGURACIÓN GENERAL
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #06162b;
      color: white;
    }


    /* =========================
       MENÚ SUPERIOR
    ========================== */

    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;

      padding: 22px 8%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 10;
    }

    .logo {
      width: 170px;
      height: auto;
      display: block;
    }

    .navbar nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .navbar nav a {
      color: white;
      text-decoration: none;

      font-size: 14px;
      font-weight: 500;

      transition: color 0.3s ease;
    }

    .navbar nav a:hover {
      color: #56d7d5;
    }


    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 100vh;

      background:
        linear-gradient(
          90deg,
          rgba(6, 22, 43, 0.98) 0%,
          rgba(6, 22, 43, 0.85) 35%,
          rgba(6, 22, 43, 0.25) 65%,
          rgba(6, 22, 43, 0.05) 100%
        ),
        url('hero-sintonia.png');

      background-size: cover;
      background-position: center;

      display: flex;
      align-items: center;

      padding: 100px 8% 60px;
    }

    .hero-content {
      max-width: 720px;
    }

    .nombre {
      font-size: 18px;
      letter-spacing: 3px;
      text-transform: uppercase;

      color: #56d7d5;

      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(42px, 6vw, 76px);
      line-height: 1.05;

      margin-bottom: 24px;
    }

    .destacado {
      color: #ff7b72;
    }

    .frase {
      font-size: 21px;
      line-height: 1.6;

      color: #d9eef2;

      max-width: 650px;

      margin-bottom: 35px;
    }


    /* =========================
       BOTONES
    ========================== */

    .botones {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .boton {
      display: inline-block;

      padding: 14px 24px;

      text-decoration: none;
      border-radius: 6px;

      font-weight: bold;

      transition: 0.3s ease;
    }

    .boton-principal {
      background: #56d7d5;
      color: #06162b;
    }

    .boton-principal:hover {
      background: white;
    }

    .boton-secundario {
      border: 1px solid #56d7d5;
      color: #56d7d5;
    }

    .boton-secundario:hover {
      background: #56d7d5;
      color: #06162b;
    }


    /* =========================
       TABLET
    ========================== */

    @media (max-width: 1000px) {

      .navbar {
        align-items: flex-start;
        gap: 20px;
      }

      .navbar nav {
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px 18px;
      }

      .hero {
        padding-top: 140px;
      }

    }


    /* =========================
       CELULAR
    ========================== */

    @media (max-width: 700px) {

      .navbar {
        position: absolute;

        flex-direction: column;
        align-items: flex-start;

        gap: 18px;

        padding: 22px 7%;
      }

      .logo {
        width: 150px;
      }

      .navbar nav {
        justify-content: flex-start;
        gap: 10px 15px;
      }

      .navbar nav a {
        font-size: 12px;
      }

      .hero {
        padding: 190px 7% 50px;

        background-position: 65% center;
      }

      h1 {
        font-size: 44px;
      }

      .nombre {
        font-size: 14px;
        letter-spacing: 2px;
      }

      .frase {
        font-size: 18px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       MENÚ
  ========================== -->

  <header class="navbar">

    <img
      src="logo-sintonia.jpg"
      alt="Marketing en SintonIA"
      class="logo"
    >

    <nav>
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#servicios">Servicios</a>
      <a href="#experiencia">Experiencia</a>
      <a href="#formacion">Formación</a>
      <a href="#proyectos">Proyectos</a>
      <a href="#newsletter">Newsletter</a>
      <a href="#contacto">Contacto</a>
    </nav>

  </header>


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">

    <div class="hero-content">

      <div class="nombre">
        Renato Chumbiauca Rebagliati
      </div>


      <h1>
        Marketing, comunicación e
        inteligencia
        <span class="destacado">
          artificial.
        </span>
      </h1>


      <p class="frase">
        Conecto estrategia, contenidos, datos y tecnología
        para construir marcas y experiencias con sentido.
      </p>


      <div class="botones">

        <a
          href="#experiencia"
          class="boton boton-principal"
        >
          Conoce mi experiencia
        </a>

        <a
          href="#newsletter"
          class="boton boton-secundario"
        >
          Marketing en SintonIA
        </a>

      </div>

    </div>

  </section>


</body>
</html>
