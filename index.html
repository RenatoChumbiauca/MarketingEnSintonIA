<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Renato Chumbiauca Rebagliati | Marketing en SintonIA</title>

  <style>

    /* ========================================
       CONFIGURACIÓN GENERAL
    ======================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #06162b;
      color: white;
    }


    /* ========================================
       CABECERA / MENÚ
    ======================================== */

    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;

      padding: 22px 7%;
    }

    .navbar-inner {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 40px;
    }

    .logo {
      display: block;

      width: auto;
      height: 60px;

      object-fit: contain;

      flex-shrink: 0;
    }

    .navbar nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;

      gap: 26px;

      flex-wrap: nowrap;
    }

    .navbar nav a {
      color: #ffffff;
      text-decoration: none;

      font-size: 14px;
      font-weight: 500;

      white-space: nowrap;

      transition: color 0.25s ease;
    }

    .navbar nav a:hover {
      color: #56d7d5;
    }


    /* ========================================
       HERO
    ======================================== */

    .hero {
      min-height: 100vh;

      background:
        linear-gradient(
          90deg,
          rgba(6, 22, 43, 0.99) 0%,
          rgba(6, 22, 43, 0.93) 28%,
          rgba(6, 22, 43, 0.68) 48%,
          rgba(6, 22, 43, 0.18) 72%,
          rgba(6, 22, 43, 0.02) 100%
        ),
        url('hero-sintonia.png');

      background-size: cover;
      background-position: center center;

      display: flex;
      align-items: center;

      padding: 150px 7% 70px;
    }

    .hero-content {
      width: 100%;
      max-width: 760px;
    }

    .nombre {
      color: #56d7d5;

      font-size: 17px;
      font-weight: 500;

      letter-spacing: 3px;
      text-transform: uppercase;

      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(48px, 5.6vw, 78px);
      line-height: 1.04;
      letter-spacing: -1px;

      margin-bottom: 28px;

      max-width: 780px;
    }

    .destacado {
      color: #ff7b72;
    }

    .frase {
      max-width: 660px;

      color: #d9eef2;

      font-size: 21px;
      line-height: 1.65;

      margin-bottom: 36px;
    }


    /* ========================================
       BOTONES
    ======================================== */

    .botones {
      display: flex;
      align-items: center;

      gap: 16px;

      flex-wrap: wrap;
    }

    .boton {
      display: inline-block;

      padding: 15px 25px;

      border-radius: 6px;

      font-size: 15px;
      font-weight: 700;

      text-decoration: none;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease;
    }

    .boton-principal {
      background: #56d7d5;
      color: #06162b;

      border: 1px solid #56d7d5;
    }

    .boton-principal:hover {
      background: #ffffff;
      border-color: #ffffff;
    }

    .boton-secundario {
      background: transparent;

      border: 1px solid #56d7d5;

      color: #56d7d5;
    }

    .boton-secundario:hover {
      background: #56d7d5;
      color: #06162b;
    }


    /* ========================================
       TABLET
    ======================================== */

    @media (max-width: 1100px) {

      .navbar {
        padding: 20px 5%;
      }

      .navbar-inner {
        gap: 25px;
      }

      .logo {
        height: 52px;
      }

      .navbar nav {
        gap: 16px;
      }

      .navbar nav a {
        font-size: 12px;
      }

      .hero {
        padding-left: 5%;
        padding-right: 5%;
      }

    }


    /* ========================================
       CELULAR
    ======================================== */

    @media (max-width: 760px) {

      .navbar {
        padding: 18px 6%;
      }

      .navbar-inner {
        flex-direction: column;
        align-items: flex-start;

        gap: 16px;
      }

      .logo {
        height: 48px;
      }

      .navbar nav {
        width: 100%;

        justify-content: flex-start;

        gap: 18px;

        overflow-x: auto;
        padding-bottom: 5px;
      }

      .navbar nav a {
        font-size: 12px;
      }

      .hero {
        min-height: 100vh;

        padding:
          180px
          6%
          60px;

        background-position: 65% center;
      }

      .nombre {
        font-size: 13px;
        letter-spacing: 2px;
      }

      h1 {
        font-size: clamp(42px, 12vw, 56px);
      }

      .frase {
        font-size: 18px;
      }

    }

  </style>
</head>


<body>


  <!-- ========================================
       CABECERA
  ======================================== -->

  <header class="navbar">

    <div class="navbar-inner">

      <img
        src="logo-sintonia.png"
        alt="Marketing en SintonIA"
        class="logo"
      >

      <nav>
        <a href="#sobre-mi">Sobre mí</a>
        <a href="#servicios">Servicios</a>
        <a href="#experiencia">Experiencia</a>
        <a href="#formacion">Formación</a>
        <a href="#proyectos">Proyectos</a>
        <a href="#newsletter">Newsletter</a>
        <a href="#contacto">Contacto</a>
      </nav>

    </div>

  </header>


  <!-- ========================================
       HERO
  ======================================== -->

  <section class="hero">

    <div class="hero-content">

      <div class="nombre">
        Renato Chumbiauca Rebagliati
      </div>

      <h1>
        Marketing, comunicación e
        inteligencia
        <span class="destacado">artificial.</span>
      </h1>

      <p class="frase">
        Conecto estrategia, contenidos, datos y tecnología
        para construir marcas y experiencias con sentido.
      </p>

      <div class="botones">

        <a
          href="#experiencia"
          class="boton boton-principal"
        >
          Conoce mi experiencia
        </a>

        <a
          href="#newsletter"
          class="boton boton-secundario"
        >
          Marketing en SintonIA
        </a>

      </div>

    </div>

  </section>


</body>

</html>
